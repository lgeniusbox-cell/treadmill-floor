
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Network Inspector</title>
<style>
  body {
    margin: 20px auto;
    padding: 0 16px;
    max-width: 1100px;
    font: 14px system-ui, sans-serif;
    background: #111827;
    color: #e5e7eb;
  }
  input, button {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #4b5563;
    background: #1f2937;
    color: white;
  }
  input { flex: 1; min-width: 180px; }
  button { cursor: pointer; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }
  #player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
  }
  iframe { width: 100%; height: 100%; border: 0; }
  #log {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    height: 360px;
    overflow: auto;
    background: #030712;
    padding: 12px;
    border: 1px solid #374151;
    border-radius: 8px;
    font: 12px/1.5 monospace;
  }
  label { display: inline-flex; align-items: center; gap: 6px; }
  .note { color: #9ca3af; line-height: 1.5; }
</style>
</head>
<body>

<h2>YouTube Network Inspector</h2>

<div class="controls">
  <input id="url" placeholder="Paste a YouTube URL">
  <button id="load">Load video</button>
</div>

<div class="controls">
  <label>
    <input type="checkbox" id="capture">
    Capture accessible response bodies (max 1 MiB each)
  </label>
  <button id="export">Export log JSON</button>
  <button id="clear">Clear log</button>
</div>

<div id="player"></div>

<p class="note">
  Logs include requests observable by this page, timing entries,
  and player events. Cross-origin iframe network responses may
  not be visible to these hooks.
</p>

<h3>Network log</h3>
<div id="log"></div>

<script>
(() => {
  const logElement = document.getElementById("log");
  const captureCheckbox = document.getElementById("capture");

  const records = [];
  const MAX_BODY = 1024 * 1024;
  const MAX_RECORDS = 3000;

  function log(type, data) {
    const entry = {
      time: new Date().toISOString(),
      type,
      ...data
    };

    records.push(entry);
    if (records.length > MAX_RECORDS) records.shift();

    console.log("[NET]", entry);

    logElement.textContent +=
      JSON.stringify(entry) + "\n";

    // Keep the visible log bounded.
    const lines = logElement.textContent.split("\n");
    if (lines.length > 1200) {
      logElement.textContent = lines.slice(-1000).join("\n");
    }

    logElement.scrollTop = logElement.scrollHeight;
  }

  function headersToObject(headers) {
    const result = {};
    try {
      headers.forEach((value, name) => {
        result[name] = value;
      });
    } catch (e) {}
    return result;
  }

  // Intercept fetch calls made in THIS JavaScript context.
  const originalFetch = window.fetch.bind(window);

  window.fetch = async function(input, init) {
    const requestUrl =
      typeof input === "string" ? input :
      input instanceof URL ? input.href :
      input.url;

    const method =
      (init && init.method) ||
      (input instanceof Request ? input.method : "GET");

    const started = performance.now();

    log("FETCH_REQUEST", {
      url: requestUrl,
      method
    });

    try {
      const response = await originalFetch(input, init);

      const info = {
        url: requestUrl,
        method,
        status: response.status,
        responseType: response.type,
        redirected: response.redirected,
        finalUrl: response.url,
        headers: headersToObject(response.headers),
        durationMs: +(performance.now() - started).toFixed(2)
      };

      const lengthHeader =
        response.headers.get("content-length");
      const contentType =
        response.headers.get("content-type") || "";

      if (lengthHeader !== null) {
        info.contentLengthHeader = lengthHeader;
      }

      // Opaque responses have no readable body or headers.
      if (response.type === "opaque") {
        info.bodyNote = "Opaque response; body inaccessible";
      }

      if (captureCheckbox.checked &&
          response.type !== "opaque" &&
          response.type !== "opaqueredirect" &&
          response.body) {
        const declaredLength = Number(lengthHeader);

        if (declaredLength > MAX_BODY) {
          info.bodyNote = "Skipped: declared body exceeds 1 MiB";
        } else {
          try {
            const bytes = await response.clone().arrayBuffer();

            if (bytes.byteLength <= MAX_BODY) {
              info.bodyBytes = bytes.byteLength;

              if (/^(text\/|application\/(json|.*xml|javascript))/
                    .test(contentType)) {
                info.bodyPreview = new TextDecoder().decode(
                  bytes.slice(0, 4096)
                );
              } else {
                info.bodyFirstBytesHex = Array.from(
                  new Uint8Array(bytes).slice(0, 64)
                ).map(b => b.toString(16).padStart(2, "0"))
                 .join(" ");
              }
            } else {
              info.bodyNote =
                "Skipped: actual body exceeds 1 MiB";
            }
          } catch (e) {
            info.bodyNote = "Body capture failed: " + e.message;
          }
        }
      }

      log("FETCH_RESPONSE", info);
      return response;
    } catch (error) {
      log("FETCH_ERROR", {
        url: requestUrl,
        method,
        error: String(error)
      });
      throw error;
    }
  };

  // Intercept XMLHttpRequest in THIS context.
  const originalOpen = XMLHttpRequest.prototype.open;
  const originalSend = XMLHttpRequest.prototype.send;
  const originalSetRequestHeader =
    XMLHttpRequest.prototype.setRequestHeader;

  XMLHttpRequest.prototype.open = function(
    method, url, ...rest
  ) {
    this.__netInfo = {
      method,
      url: String(url),
      headers: {}
    };

    return originalOpen.call(this, method, url, ...rest);
  };

  XMLHttpRequest.prototype.setRequestHeader = function(name, value) {
    if (this.__netInfo) {
      this.__netInfo.headers[name] = value;
    }
    return originalSetRequestHeader.call(this, name, value);
  };

  XMLHttpRequest.prototype.send = function(body) {
    const xhr = this;
    const info = xhr.__netInfo || {
      method: "UNKNOWN",
      url: ""
    };

    const started = performance.now();

    log("XHR_REQUEST", {
      ...info,
      requestBodyType: body == null ? null : typeof body
    });

    xhr.addEventListener("loadend", function() {
      const result = {
        ...info,
        status: xhr.status,
        responseURL: xhr.responseURL,
        responseType: xhr.responseType || "text",
        responseHeaders: xhr.getAllResponseHeaders(),
        durationMs: +(performance.now() - started).toFixed(2)
      };

      if (captureCheckbox.checked) {
        try {
          if (xhr.responseType === "arraybuffer" &&
              xhr.response instanceof ArrayBuffer) {
            const bytes = new Uint8Array(xhr.response);

            result.bodyBytes = bytes.byteLength;

            if (bytes.byteLength <= MAX_BODY) {
              result.bodyFirstBytesHex = Array.from(
                bytes.slice(0, 64)
              ).map(b => b.toString(16).padStart(2, "0"))
               .join(" ");
            } else {
              result.bodyNote = "Body too large to capture";
            }
          } else if (
            xhr.responseType === "" ||
            xhr.responseType === "text"
          ) {
            const text = xhr.responseText;
            result.bodyChars = text.length;
            result.bodyPreview = text.slice(0, 4096);
          } else {
            result.bodyNote =
              "Preview not implemented for this XHR response type";
          }
        } catch (e) {
          result.bodyNote = "Capture failed: " + e.message;
        }
      }

      log("XHR_RESPONSE", result);
    }, { once: true });

    return originalSend.call(xhr, body);
  };

  // Observe resource URLs and timing visible to the parent page.
  try {
    const observer = new PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        log("RESOURCE_TIMING", {
          name: entry.name,
          initiatorType: entry.initiatorType,
          durationMs: +entry.duration.toFixed(2),
          transferSize: entry.transferSize,
          encodedBodySize: entry.encodedBodySize,
          decodedBodySize: entry.decodedBodySize
        });
      }
    });

    observer.observe({ type: "resource", buffered: true });
  } catch (e) {
    log("OBSERVER_ERROR", { error: String(e) });
  }

  // Extract video IDs from common YouTube URL formats.
  function extractVideoId(value) {
    try {
      const u = new URL(value);

      if (u.hostname === "youtu.be") {
        return u.pathname.split("/").filter(Boolean)[0] || null;
      }

      if (
        u.hostname === "youtube.com" ||
        u.hostname.endsWith(".youtube.com") ||
        u.hostname === "youtube-nocookie.com"
      ) {
        if (u.pathname === "/watch") {
          return u.searchParams.get("v");
        }

        const match = u.pathname.match(
          /^\/(?:embed|shorts|live)\/([^/?]+)/
        );

        return match ? match[1] : null;
      }
    } catch (e) {}

    return null;
  }

  document.getElementById("load").onclick = () => {
    const id = extractVideoId(
      document.getElementById("url").value.trim()
    );

    if (!id) {
      alert("Enter a valid YouTube video URL.");
      return;
    }

    log("PLAYER_LOAD", { videoId: id });

    const player = document.getElementById("player");
    player.replaceChildren();

    const iframe = document.createElement("iframe");
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;

    iframe.src =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(id) +
      "?enablejsapi=1&playsinline=1&origin=" +
      encodeURIComponent(location.origin);

    iframe.onload = () => {
      log("IFRAME_LOAD", {
        url: iframe.src,
        note: "Iframe loaded; internal requests are not exposed by this event"
      });
    };

    player.appendChild(iframe);
  };

  document.getElementById("clear").onclick = () => {
    records.length = 0;
    logElement.textContent = "";
  };

  document.getElementById("export").onclick = () => {
    const blob = new Blob(
      [JSON.stringify(records, null, 2)],
      { type: "application/json" }
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "network-log.json";
    a.click();

    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  log("READY", {
    note: "Hooks installed in parent context before player creation",
    origin: location.origin
  });
})();
</script>
</body>
</html>
